name: ETL SCR + COBROS — regenerar datos del dashboard

# Cuándo corre:
#  - schedule: cron programado (UTC). Cada día a las 06:00 UTC (01:00 Colombia).
#  - workflow_dispatch: botón "Run workflow" para dispararlo manualmente.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# El job necesita permiso de escritura para commitear el JSON regenerado.
permissions:
  contents: write

# Evita corridas solapadas si una tarda más que el intervalo.
concurrency:
  group: etl-scr
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        working-directory: Etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ETL (SCR + COBROS)
        working-directory: Etl
        env:
          SCR_DATABASE_URL: ${{ secrets.SCR_DATABASE_URL }}
          ETL_LOG_LEVEL: INFO
        run: python run_etl.py --proceso todos

      - name: Repartir JSON a donde realmente se leen
        run: |
          # --- SCR ---
          mkdir -p Frontend/dashboard/public/scr Backend/app/data/scr

          cp Etl/salida/scr/data.json Etl/salida/scr/data_*.json \
             Etl/salida/scr/direcciones.json \
             Frontend/dashboard/public/scr/

          cp Etl/salida/scr/data.json Etl/salida/scr/data_*.json \
             Etl/salida/scr/direcciones.json \
             Etl/salida/scr/observaciones_*.json \
             Backend/app/data/scr/

          # --- COBROS ---
          mkdir -p Frontend/dashboard/public/cobros Backend/app/data/cobros

          cp Etl/salida/cobros/data.json Etl/salida/cobros/data_*.json \
             Etl/salida/cobros/direcciones.json \
             Frontend/dashboard/public/cobros/

          cp Etl/salida/cobros/data.json Etl/salida/cobros/data_*.json \
             Etl/salida/cobros/direcciones.json \
             Etl/salida/cobros/observaciones_*.json \
             Backend/app/data/cobros/

      - name: Commitear los datos (si cambiaron)
        run: |
          git config user.name  "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"

          # Dejar de trackear Etl/salida/ (ahora está en .gitignore).
          git rm -r --cached --ignore-unmatch Etl/salida/

          git add Frontend/dashboard/public Backend/app/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; no se commitea."
          else
            git commit -m "chore(etl): datos regenerados desde la BD"
            git pull --rebase --autostash origin main
            git push origin main
          fi
