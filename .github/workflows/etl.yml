name: ETL SCR — regenerar datos del dashboard

# Cuándo corre:
#  - schedule: cron programado (UTC). El ejemplo corre cada día a las 06:00 UTC
#    (01:00 hora Colombia). Ajusta el cron a tu necesidad.
#  - workflow_dispatch: botón "Run workflow" para dispararlo manualmente.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# El job necesita permiso de escritura para commitear el JSON regenerado.
permissions:
  contents: write

# Evita corridas solapadas si una tarda más que el intervalo.
concurrency:
  group: etl-scr
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        working-directory: Etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ETL
        working-directory: Etl
        env:
          # El secreto se configura en Settings → Secrets and variables → Actions.
          SCR_DATABASE_URL: ${{ secrets.SCR_DATABASE_URL }}
          ETL_LOG_LEVEL: INFO
        run: python run_etl.py

      # El tablero lee de su propio public/, no de Etl/salida/. Van solo los
      # data*.json: los observaciones_*.json son del backend, y en el frontend
      # serían peso muerto en cada visita al tablero.
      #
      # Depende de que el ETL escriba en Etl/salida/, que es su valor por
      # defecto. Si alguien vuelve a definir ETL_OUTPUT_DIR en las variables del
      # repositorio, esta copia falla y el paso se cae — que es lo que se quiere:
      # antes apuntaba a dashboard/public/ y los datos llevaban días aterrizando
      # en una carpeta que nadie lee, sin que nada avisara.
      - name: Repartir los JSON del mapa al tablero
        run: cp Etl/salida/data.json Etl/salida/data_*.json Frontend/dashboard/public/

      # PENDIENTE: el reparto a Backend/app/data/, que es lo que lee el chat,
      # sigue siendo manual.
      - name: Commitear el JSON regenerado (si cambió)
        run: |
          git config user.name  "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          # La carpeta entera, no una lista: el ETL escribe también
          # direcciones.json y los observaciones_*.json, y enumerarlos dejaba
          # el árbol sucio, con lo que el rebase se negaba y el push no corría.
          git add Etl/salida Frontend/dashboard/public
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; no se commitea."
          else
            git commit -m "chore(etl): datos regenerados desde la BD"
            git pull --rebase --autostash origin main
            git push origin main
          fi
