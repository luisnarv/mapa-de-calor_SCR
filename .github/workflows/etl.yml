name: ETL SCR — regenerar datos del dashboard

# Cuándo corre:
#  - schedule: cron programado (UTC). El ejemplo corre cada día a las 06:00 UTC
#    (01:00 hora Colombia). Ajusta el cron a tu necesidad.
#  - workflow_dispatch: botón "Run workflow" para dispararlo manualmente.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# El job necesita permiso de escritura para commitear el JSON regenerado.
permissions:
  contents: write

# Evita corridas solapadas si una tarda más que el intervalo.
concurrency:
  group: etl-scr
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        working-directory: Etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ETL
        working-directory: Etl
        env:
          # El secreto se configura en Settings → Secrets and variables → Actions.
          SCR_DATABASE_URL: ${{ secrets.SCR_DATABASE_URL }}
          ETL_LOG_LEVEL: INFO
        run: python run_etl.py

      - name: Repartir JSON a donde realmente se leen
        run: |
          # Frontend: solo data*.json y direcciones (no observaciones).
          cp Etl/salida/data.json Etl/salida/data_*.json Etl/salida/direcciones.json \
             Frontend/dashboard/public/

          # Backend: todo (data, direcciones, observaciones).
          cp Etl/salida/data.json Etl/salida/data_*.json Etl/salida/direcciones.json \
             Etl/salida/observaciones_*.json \
             Backend/app/data/

      - name: Commitear los datos (si cambiaron)
        run: |
          git config user.name  "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"

          # Dejar de trackear Etl/salida/ (ahora está en .gitignore).
          git rm -r --cached --ignore-unmatch Etl/salida/

          git add Frontend/dashboard/public Backend/app/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; no se commitea."
          else
            git commit -m "chore(etl): datos regenerados desde la BD"
            git pull --rebase --autostash origin main
            git push origin main
          fi
